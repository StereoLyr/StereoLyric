    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateX(50px);
    }

    to {
        opacity: 1;
        transform: translateX(0px);
    }
}

.fade-in{
    opacity:0;
    animation:fadeIn 1.8s ease forwards;
}

.character {
    transition: filter .35s ease;
}

.character:hover {
    filter: blur(0);
}

.banner:has(.character:hover) .character {
    filter: blur(6px);
}

.banner:has(.character:hover) .character:hover {
    filter: blur(0);
}
        /* =========================
   CELULAR
========================= */

@media (max-width: 768px) {

    /* Ocultar menú de PC */
    .desktop-menu {
        display: none;
    }

    /* Banner */
    .banner {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }

    /* Fondo */
    .banner .background {
        width: auto !important;
        height: 100% !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
    }

    /* Personajes */
    .character {
        max-width: none;
    }

    /* Rosado */
    .character.rosado {
        left: -5% !important;
        width: 65% !important;
    }

    /* Celeste */
    .character.celeste {
        left: 12% !important;
        width: 43% !important;
    }

    /* Centro */
    .character.centro {
        left: 27% !important;
        width: 57% !important;
    }

    /* Chica */
    .character.chica {
        left: 52% !important;
        width: 47% !important;
    }

    /* Rubio */
    .character.rubio {
        left: 63% !important;
        width: 55% !important;
    }

    /* Letras */
    .banner .letters {
        width: auto !important;
        height: 100% !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
    }

    /* Footer */
    .footer {
        height: 40px;
        min-height: 40px;
        padding: 0 10px !important;
    }

    .footer a,
    .footer span {
        font-size: 9px !important;
    }

}
        /* =========================
   SELECTOR DE CLUBES
========================= */

.club-menu {
    position:absolute;
    top:18px;
    left:15%;
    z-index:20;

    display:flex;
    flex-wrap:wrap;
    gap:6px;

    width:500px;
}

.club-button {
    display:flex;
    align-items:center;
    justify-content:center;

    height:28px;
    padding:0 15px;

    border:1px solid rgba(255,255,255,.7);
    border-radius:18px;

    color:#fff;
    background:rgba(0,0,0,.25);

    text-decoration:none;

    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;

    transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
}

.club-button:hover {
    color:#000;
    background:#fff;
    border-color:#fff;

    text-decoration:none;
}

.club-button.active {
    background:#fff;
    color:#000;
    border-color:#fff;
}
</style>
